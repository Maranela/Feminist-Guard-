<!-- SAFE REGISTER - POPIA COMPLIANT - No full ID stored -->
<script>
// Hash function - one way, can't reverse
async function hashID(id){
  const encoder = new TextEncoder();
  const data = encoder.encode(id);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2,'0')).join('');
}

async function registerUserSafe(){
  const id = document.getElementById('regId').value.trim();
  const name = document.getElementById('fullName').value;
  
  if(!checkRegID(id)){ alert("❌ Invalid SA ID"); return; }
  if(!document.getElementById('popia').checked){ alert("Please accept POPIA"); return; }

  // SAFE: Only keep last 4 + hash + birth year
  const last4 = id.slice(-4);
  const birthYear = "19" + id.substring(0,2); // from 920315...
  const idHash = await hashID(id); // cannot be reversed to ID

  // Save SAFE data only
  const safeUser = {
    name: name,
    id_last4: last4,
    id_hash: idHash.substring(0,16) + "...", // partial hash
    birthYear: birthYear,
    verified: true,
    date: new Date().toISOString()
  };

  localStorage.setItem('fg_user_safe', JSON.stringify(safeUser));
  
  // IMPORTANT: Delete full ID from memory
  document.getElementById('regId').value = "";
  
  alert("✅ Verified! Account created safely.\nID not stored - only ..."+last4+" kept for safety");
  window.location = "index.html";
}
</script>
