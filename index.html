<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#be185d">
  <title>Feminist-Guard</title>
  <style>
    body { font-family: Arial; background: #fff1f2; margin: 0; padding: 20px; text-align: center; }
    h1 { color: #be185d; }
    .card { background: white; border-radius: 15px; padding: 20px; margin: 20px auto; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    button { background: #be185d; color: white; border: none; padding: 15px 30px; border-radius: 10px; font-size: 18px; margin: 10px; width: 90%; }
    button:active { background: #9f1239; }
  </style>
</head>
<body>
  <h1>Feminist-Guard</h1>
  <p>Your Safety, Your Power</p>
  
  <div class="card">
    <h2>Emergency</h2>
    <button onclick="alert('SOS Alert Sent to trusted contacts!')">🚨 SEND SOS</button>
    <button onclick="alert('Location Shared!')">📍 Share Location</button>
  </div>

  <div class="card">
    <h2>Quick Help</h2>
    <button onclick="window.location.href='tel:10111'">📞 Call Police 10111</button>
    <button>💬 Safe Chat</button>
  </div>

  <p style="font-size:12px; color:gray;">PWA Ready - Installable as APK</p>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
</script>
</body>
</html>
