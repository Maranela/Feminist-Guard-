<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feminist-Guard V7</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#C2185B">
<style>
body{margin:0;font-family:Arial;background:#FFF0F3;color:#4A0E4E}
header{background:#4A0E4E;color:white;padding:15px;text-align:center}
h1{margin:0;color:#FF2D78}
.logo{width:80px;border-radius:15px}
.page{padding:15px;max-width:450px;margin:auto}
.card{background:white;border-radius:20px;padding:18px;margin:15px 0;box-shadow:0 2px 10px #0001}
#sosBtn{width:200px;height:200px;border-radius:50%;background:#FF2D78;color:white;font-size:34px;font-weight:bold;border:6px solid white;display:block;margin:20px auto;box-shadow:0 0 25px #FF2D78}
.btn{width:100%;padding:14px;border-radius:12px;border:none;margin:6px 0;font-size:16px;color:white;background:#C2185B}
.btn2{background:#4A0E4E}
.btn3{background:#880E4F}
input,select{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #ccc;box-sizing:border-box}
.langBox{display:flex;gap:5px;flex-wrap:wrap}
.langBtn{padding:8px 12px;border-radius:8px;border:1px solid #C2185B;background:white;color:#C2185B}
.langBtn.active{background:#C2185B;color:white}
.hidden{display:none}
</style>
</head>
<body>
<header>
<img src="icon-192.png" class="logo"><br>
<h1>Feminist-Guard V7</h1>
<small id="tag">STRONG. SAFE. PROTECTED. - Pretoria</small>
</header>

<!-- LOGIN PAGE -->
<div id="loginPage" class="page">
<div class="card">
<h2 id="t_welcome">Welcome Queen 👑</h2>
<div class="langBox">
<button class="langBtn active" onclick="setLang('en')">English</button>
<button class="langBtn" onclick="setLang('nso')">Sepedi</button>
<button class="langBtn" onclick="setLang('ve')">Venda</button>
<button class="langBtn" onclick="setLang('ts')">Xitsonga</button>
</div>
<input id="userName" placeholder="Your Name">
<input id="userPhone" placeholder="Your Phone +27...">
<button class="btn" onclick="doLogin()" id="t_enter">Enter App →</button>
</div>
</div>

<!-- HOME PAGE -->
<div id="homePage" class="page hidden">
<div class="card" style="text-align:center">
<h2 id="t_hello">Hello, Queen ✓</h2>
<button id="sosBtn" onclick="sendSOS()">SOS</button>
<p id="status">Hold SOS to send help</p>
<button class="btn" onclick="shareLoc()" id="t_share">📍 Share Live Location</button>
</div>

<div class="card">
<h3 id="t_quick">Quick Help</h3>
<button class="btn btn2" onclick="window.location.href='tel:10111'">📞 <span id="t_police">Call Police 10111</span></button>
<button class="btn btn3" onclick="fakeCall()" id="t_fake">📱 Fake Incoming Call</button>
<button class="btn" style="background:#6A1B9A" onclick="toggleRec()" id="recBtn">🎙️ Secret Voice Record</button>
<p id="recStatus" style="font-size:12px"></p>
</div>

<div class="card">
<h3 id="t_contacts">👩‍👧‍👧 My Guardians</h3>
<div id="contactList"></div>
<input id="cName" placeholder="Name - e.g. Mom">
<input id="cPhone" placeholder="WhatsApp +27...">
<button class="btn" style="background:#4CAF50" onclick="addContact()" id="t_add">Add Guardian</button>
</div>

<button class="btn btn2" onclick="logout()" id="t_logout">Logout</button>
<p style="text-align:center;font-size:11px;color:#888;margin-top:20px">Feminist-Guard V7 - Safe Trip • Qala Uhambo Oluphephile</p>
</div>

<script>
let lang='en';
const T={
en:{welcome:"Welcome Queen 👑",enter:"Enter App →",hello:"Hello, ",quick:"Quick Help",police:"Call Police 10111",fake:"📱 Fake Incoming Call",contacts:"👩‍👧‍👧 My Guardians",add:"Add Guardian",share:"📍 Share Live Location",logout:"Logout",saved:"Saved!",hold:"Hold SOS to send help",sent:"🚨 SOS SENT to guardians!"},
nso:{welcome:"Amogela Mohumagadi 👑",enter:"Tsena →",hello:"Dumela, ",quick:"Thušo ya Pele",police:"Letšetša Maphodisa 10111",fake:"📱 Mogala wa Maaka",contacts:"👩‍👧‍👧 Bahlokomedi ba Ka",add:"Oketša Mohlokomedi",share:"📍 Abelana Lefelo",logout:"Tswa",saved:"Bolokilwe!",hold:"Tobetsa SOS go romela thušo",sent:"🚨 SOS e rometšwe!"},
ve:{welcome:"Ni khou dzhena Vhomakhadzi 👑",enter:"Dzhenani →",hello:"Ndaa, ",quick:"Thuso ya Vhukale",police:"Founela Mapholisa 10111",fake:"📱 Lutingo lwa Mafhi",contacts:"👩‍👧‍👧 Vhalondoti Vhanga",add:"Engedza Mulondoti",share:"📍 Avelana Fhethu",logout:"Bva",saved:"Zwo Bulungwa!",hold:"Tobetsa SOS u ruma thuso",sent:"🚨 SOS yo rumelwa!"},
ts:{welcome:"Wamukela Hosi 👑",enter:"Nghena →",hello:"Minghani, ",quick:"Mpfuno ya Hatlisa",police:"Fonelani Maphorisa 10111",fake:"📱 Riingo ra Hembhe",contacts:"👩‍👧‍👧 Vahlayisi Vanga",add:"Engetela Muhlayisi",share:"📍 Avelana Ndhawu",logout:"Huma",saved:"Hlayisiwile!",hold:"Tshikilela SOS ku rhumela mpfuno",sent:"🚨 SOS yi rhumeriwile!"}
};

function setLang(l){
 lang=l;
 document.querySelectorAll('.langBtn').forEach(b=>b.classList.remove('active'));
 event.target.classList.add('active');
 applyLang();
 localStorage.setItem('fg_lang',l);
}
function applyLang(){
 let t=T[lang];
 document.getElementById('t_welcome').innerText=t.welcome;
 document.getElementById('t_enter').innerText=t.enter;
 document.getElementById('t_quick').innerText=t.quick;
 document.getElementById('t_police').innerText=t.police;
 document.getElementById('t_fake').innerText=t.fake;
 document.getElementById('t_contacts').innerText=t.contacts;
 document.getElementById('t_add').innerText=t.add;
 document.getElementById('t_share').innerText=t.share;
 document.getElementById('t_logout').innerText=t.logout;
 let s=document.getElementById('status'); if(s) s.innerText=t.hold;
 let u=localStorage.getItem('fg_user'); if(u){ try{document.getElementById('t_hello').innerText=t.hello+JSON.parse(u).name+" ✓"}catch(e){} }
}

function doLogin(){
 let n=document.getElementById('userName').value.trim();
 let p=document.getElementById('userPhone').value.trim();
 if(!n||!p) return alert("Enter name & phone");
 localStorage.setItem('fg_user',JSON.stringify({name:n,phone:p}));
 showHome();
}
function showHome(){
 document.getElementById('loginPage').classList.add('hidden');
 document.getElementById('homePage').classList.remove('hidden');
 applyLang(); loadContacts();
}
function logout(){
 if(confirm("Logout?")){ localStorage.removeItem('fg_user'); location.reload(); }
}
function addContact(){
 let n=document.getElementById('cName').value.trim();
 let p=document.getElementById('cPhone').value.trim();
 if(!n||!p) return alert("Enter name & phone");
 let arr=JSON.parse(localStorage.getItem('fg_contacts')||"[]");
 arr.push({name:n,phone:p}); localStorage.setItem('fg_contacts',JSON.stringify(arr));
 document.getElementById('cName').value=''; document.getElementById('cPhone').value='';
 loadContacts(); alert(T[lang].saved);
}
function loadContacts(){
 let arr=JSON.parse(localStorage.getItem('fg_contacts')||"[]");
 document.getElementById('contactList').innerHTML=arr.map((c,i)=>`<p>• ${c.name} - ${c.phone} <span style="color:red;cursor:pointer" onclick="delC(${i})">✖</span></p>`).join('')||"<p style='color:#888;font-size:13px'>No guardians yet</p>";
}
function delC(i){
 let arr=JSON.parse(localStorage.getItem('fg_contacts')||"[]");
 arr.splice(i,1); localStorage.setItem('fg_contacts',JSON.stringify(arr)); loadContacts();
}
function shareLoc(){
 navigator.geolocation.getCurrentPosition(pos=>{
  let link=`https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;
  alert("Your Location: "+link);
  if(navigator.share) navigator.share({title:"My Location - Feminist-Guard",text:"I am here:",url:link});
 },()=>alert("Please allow location"));
}
function sendSOS(){
 let arr=JSON.parse(localStorage.getItem('fg_contacts')||"[]");
 if(arr.length==0) return alert("Add a guardian first!");
 navigator.geolocation.getCurrentPosition(pos=>{
  let link=`https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;
  let user=JSON.parse(localStorage.getItem('fg_user')||'{"name":"Queen"}');
  let msg=`🚨 SOS! I am ${user.name}, I need help! My location: ${link} - Sent via Feminist-Guard V7`;
  arr.forEach(c=>{
   let num=c.phone.replace(/[^0-9]/g,'');
   window.open(`https://wa.me/${num}?text=${encodeURIComponent(msg)}`,'_blank');
  });
  document.getElementById('status').innerText=T[lang].sent;
  navigator.vibrate([500,200,500,200,500]);
 },()=>alert("Allow location to send SOS"));
}
function fakeCall(){
 let arr=JSON.parse(localStorage.getItem('fg_contacts')||"[]");
 let name=arr[0]?.name||"Mom";
 document.body.innerHTML=`<div style="min-height:100vh;background:black;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center"><p>Incoming call...</p><h1 style="font-size:36px">${name} 📞</h1><p> Pretoria - Slide to answer</p><div style="display:flex;gap:40px;margin-top:40px"><button onclick="location.reload()" style="background:red;padding:20px 30px;border-radius:50%;border:none;font-size:20px;color:white">✖</button><button onclick="location.reload()" style="background:green;padding:20px 30px;border-radius:50%;border:none;font-size:20px;color:white">✔</button></div><button onclick="location.reload()" style="margin-top:50px;background:#333;color:white;padding:10px 20px;border-radius:10px">End - You are safe</button></div>`;
 let a=new Audio('https://www.soundjay.com/phone/phone-ringing-2.mp3'); a.loop=true; a.play().catch(()=>{});
}
let rec=false;
function toggleRec(){
 rec=!rec;
 document.getElementById('recStatus').innerText=rec?"🔴 Recording... Tap again to stop":"✅ Recording saved (simulated) - In real app saves to phone";
 document.getElementById('recBtn').innerText=rec?"🔴 Stop Recording":"🎙️ Secret Voice Record";
 document.getElementById('recBtn').style.background=rec?"red":"#6A1B9A";
}

window.onload=()=>{
 let savedLang=localStorage.getItem('fg_lang')||'en'; lang=savedLang;
 let u=localStorage.getItem('fg_user');
 if(u){ showHome(); } else { applyLang(); }
 let c1=localStorage.getItem('fg_lang');
 if(c1) document.querySelectorAll('.langBtn').forEach(b=>{ if(b.innerText.toLowerCase().includes(c1) || (c1=='en'&&b.innerText=='English')){} });
}
</script>
</body>
</html>
