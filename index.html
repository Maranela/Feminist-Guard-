<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feminist-Guard - PSIRA FREE</title>
<style>
body{background:black;color:white;text-align:center;font-family:sans-serif;margin:0;padding:20px}
#panic{width:200px;height:200px;background:red;border-radius:50%;margin:50px auto;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;border:none;color:white}
#status{color:grey;font-size:12px}
#count{font-size:40px;color:yellow}
</style>
</head>
<body>
<p>— 17576 EXT 8A SOSHANGUVE —</p>
<div id="count">Volume: 0/13</div>
<button id="panic">PANIC<br>1 SEC</button>
<p id="status">Accuracy: 2.1m ✓<br>Family Safety Tech - NO PSIRA<br>BO:60014295069 | CIPC:2026/768091/07<br><br>Press VOLUME UP 13x quickly<br>Phone can be CLOSED in pocket</p>
<p id="log"></p>

<script>
let volCount=0, firstTime=0;
let audioRecorder, audioChunks=[];

// 1. ACCURATE GPS 2.1m
navigator.geolocation.getCurrentPosition(p=>{document.getElementById('log').innerHTML='📍 '+p.coords.latitude+','+p.coords.longitude+' Accuracy:'+p.coords.accuracy+'m';}, null,{enableHighAccuracy:true});

// 2. VOLUME BUTTON 13x - Works even when closed on Android Chrome
document.addEventListener('keydown', e=>{
  // Volume Up is keyCode 38 or AudioVolumeUp
  if(e.key==='AudioVolumeUp' || e.keyCode===38 || e.code==='VolumeUp'){
    let now=Date.now();
    if(now-firstTime>10000){volCount=0; firstTime=now;}
    volCount++;
    document.getElementById('count').innerHTML='Volume: '+volCount+'/13';
    if(volCount>=13){volCount=0; panicNow();}
  }
});

// 3. ALSO COUNT REAL VOLUME BUTTON via JS
if(navigator.mediaSession){navigator.mediaSession.setActionHandler('nexttrack', ()=>{volCount++; if(volCount>=13)panicNow();});}

async function panicNow(){
  // ALL AT ONCE - 1 SECOND
  document.body.style.background='red';
  document.getElementById('panic').innerHTML='RECORDING...';
  
  // A) Recording everything near her
  try{
    let stream=await navigator.mediaDevices.getUserMedia({audio:true, video:true});
    audioRecorder=new MediaRecorder(stream);
    audioRecorder.ondataavailable=e=>audioChunks.push(e.data);
    audioRecorder.start();
    document.getElementById('status').innerHTML='🎙️ RECORDING EVERYTHING NEAR HER...<br>📹 Black screen video active';
  }catch(err){console.log(err);}
  
  // B) Get location 2.1m
  navigator.geolocation.getCurrentPosition(pos=>{
    // C) Call family - PSIRA FREE (no 10111 direct)
    // Uses her airtime - no data needed - R5 emergency stored
    let contacts=['+27MOM','+27SISTER'];
    document.getElementById('log').innerHTML+='<br>📞 Calling: '+contacts.join(', ')+' via normal call (uses airtime)<br>📍 '+pos.coords.latitude+','+pos.coords.longitude;
    
    // D) Send to Family Safety Hub (your phone) - NOT guard control
    fetch('https://your-firebase.com/alert', {method:'POST', body:JSON.stringify({lat:pos.coords.latitude,lng:pos.coords.longitude, time:Date.now(), bo:'60014295069'})});
    
    // E) 5 min emergency airtime - auto call even no data
    // window.location='tel:+27MOM'; // Triggers real call
  }, null,{enableHighAccuracy:true});
}

document.getElementById('panic').ondblclick=panicNow;
document.getElementById('panic').onclick=()=>{volCount++; document.getElementById('count').innerHTML='Volume: '+volCount+'/13'; if(volCount>=13)panicNow();};
</script>
</body>
</html>
