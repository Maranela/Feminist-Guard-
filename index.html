<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#be185d">
<title>Feminist-Guard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#FFF0F3;min-height:100vh}
.container{max-width:420px;margin:0 auto;padding:20px}
h1{color:#be185d;text-align:center;font-size:28px;margin:15px 0 5px}
.subtitle{text-align:center;color:#666;margin-bottom:20px}
.card{background:white;border-radius:20px;padding:20px;margin:15px 0;box-shadow:0 4px 15px rgba(190,24,93,0.1)}
input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;margin:8px 0;font-size:16px}
button{width:100%;padding:15px;border:none;border-radius:14px;font-size:16px;font-weight:bold;margin-top:10px}
.btn-primary{background:#be185d;color:white}
.sos-btn{background:#be185d;color:white;padding:22px;font-size:22px;animation:pulse 2s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.02)}100%{transform:scale(1)}}
.contact-item{background:#FFF0F3;padding:10px;border-radius:10px;margin:6px 0;display:flex;justify-content:space-between}
.hidden{display:none}
.fake-call-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:#111;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000}
</style>
</head>
<body>
<div id="loginPage" class="container">
<h1>Feminist-Guard</h1>
<p class="subtitle">Your Safety, Your Power 💖</p>
<div class="card">
<h2>Welcome Sister</h2>
<p style="font-size:14px;color:#666;margin:10px 0">Create account - stays on your phone</p>
<input id="regName" placeholder="Your Name *">
<input id="regPhone" placeholder="Your Phone +27... *">
<button class="btn-primary" onclick="doLogin()">Enter My Safe App →</button>
</div>
</div>
<div id="homePage" class="container hidden">
<h1>Feminist-Guard</h1>
<p class="subtitle">Hi <span id="userNameDisplay"></span> 💖</p>
<div class="card">
<h2 style="color:#be185d">🚨 EMERGENCY</h2>
<button class="sos-btn" onclick="sendSOS()">🚨 SEND SOS</button>
<p style="font-size:12px;text-align:center;margin-top:8px;color:#666">Sends live location via WhatsApp</p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">
<button style="background:#880E4F;color:white" onclick="shareLocation()">📍 Share Location</button>
<button style="background:#880E4F;color:white" onclick="window.open('tel:10111')">📞 Police 10111</button>
</div>
</div>
<div class="card">
<h2>Quick Tools</h2>
<button style="background:#880E4F;color:white" onclick="triggerFakeCall()">📱 Fake Call</button>
<button id="recordBtn" style="background:#6A1B9A;color:white" onclick="toggleRecord()">🎙️ Secret Record</button>
<button style="background:white;color:#be185d;border:2px solid #be185d" onclick="window.open('tel:0800428428')">💬 GBV Helpline</button>
</div>
<div class="card">
<h2>👩‍👧‍👧 Emergency Contacts</h2>
<div id="contactList"></div>
<input id="cName" placeholder="Name (e.g. Mom)">
<input id="cPhone" placeholder="WhatsApp +27...">
<button style="background:#2E7D32;color:white" onclick="addContact()">+ Add Contact</button>
</div>
<div class="card"><button style="background:white;color:#be185d;border:2px solid #be185d" onclick="logout()">Logout</button></div>
</div>
<div id="fakeCallScreen" class="fake-call-screen hidden">
<p>INCOMING CALL...</p>
<h1 id="fakeCallerName" style="color:white;font-size:40px;margin:20px">Mom</h1>
<div style="display:flex;gap:50px;margin-top:60px">
<button onclick="endFakeCall()" style="width:70px;height:70px;border-radius:50%;background:#d32f2f;color:white;font-size:24px;border:none">✖</button>
<button onclick="endFakeCall()" style="width:70px;height:70px;border-radius:50%;background:#2E7D32;color:white;font-size:24px;border:none">✔</button>
</div>
<button onclick="endFakeCall()" style="margin-top:40px;background:#333;width:auto;padding:10px 20px;border-radius:20px;color:white">End - Safe Now</button>
</div>
<script>
let contacts=JSON.parse(localStorage.getItem('fg_contacts')||'[]');
let user=JSON.parse(localStorage.getItem('fg_user')||'null');
let isRecording=false;let mediaRecorder;
function init(){if(user)showHome();renderContacts()}
function doLogin(){const name=document.getElementById('regName').value.trim();const phone=document.getElementById('regPhone').value.trim();if(!name||!phone){alert('Enter name and phone');return}user={name,phone};localStorage.setItem('fg_user',JSON.stringify(user));showHome()}
function showHome(){document.getElementById('loginPage').classList.add('hidden');document.getElementById('homePage').classList.remove('hidden');document.getElementById('userNameDisplay').innerText=user.name;renderContacts()}
function logout(){if(confirm('Logout?')){localStorage.removeItem('fg_user');location.reload()}}
function addContact(){const name=document.getElementById('cName').value.trim();let phone=document.getElementById('cPhone').value.trim();if(!name||!phone){alert('Enter details');return}contacts.push({name,phone});localStorage.setItem('fg_contacts',JSON.stringify(contacts));document.getElementById('cName').value='';document.getElementById('cPhone').value='';renderContacts()}
function renderContacts(){const list=document.getElementById('contactList');if(contacts.length==0){list.innerHTML='<p style="color:#999;font-size:13px">No contacts yet</p>';return}list.innerHTML=contacts.map((c,i)=>`<div class="contact-item"><span><b>${c.name}</b> ${c.phone}</span><span onclick="removeContact(${i})" style="color:red">✖</span></div>`).join('')}
function removeContact(i){contacts.splice(i,1);localStorage.setItem('fg_contacts',JSON.stringify(contacts));renderContacts()}
function shareLocation(){navigator.geolocation.getCurrentPosition(p=>{const link=`https://maps.google.com/?q=${p.coords.latitude},${p.coords.longitude}`;prompt('Copy location:',link)},()=>alert('Allow location'))}
function sendSOS(){if(contacts.length==0){alert('Add contact first!');return}navigator.geolocation.getCurrentPosition(pos=>{const mapLink=`https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;const msg=`🚨 SOS! I NEED HELP! I am ${user.name}. Location: ${mapLink} - Feminist-Guard`;contacts.forEach(c=>{let clean=c.phone.replace(/[^0-9]/g,'');window.open(`https://wa.me/${clean}?text=${encodeURIComponent(msg)}`,'_blank')});alert('SOS sent!')},()=>alert('Enable location'))}
function triggerFakeCall(){document.getElementById('fakeCallerName').innerText=contacts[0]?.name||'Mom';document.getElementById('fakeCallScreen').classList.remove('hidden')}
function endFakeCall(){document.getElementById('fakeCallScreen').classList.add('hidden')}
function toggleRecord(){const btn=document.getElementById('recordBtn');if(!isRecording){navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{mediaRecorder=new MediaRecorder(s);mediaRecorder.start();isRecording=true;btn.innerText='🔴 Recording... Tap to Stop';btn.style.background='red'}).catch(()=>alert('Mic needed'))}else{mediaRecorder.stop();isRecording=false;btn.innerText='🎙️ Secret Record';btn.style.background='#6A1B9A';mediaRecorder.ondataavailable=e=>{const url=URL.createObjectURL(e.data);const a=document.createElement('a');a.href=url;a.download='evidence.webm';a.click();alert('Saved!')}}}
init();
</script>
</body>
</html>
